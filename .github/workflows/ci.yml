name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the previous run's result irrelevant, so
# it cancels. Pushes to `main` key on the commit instead and never cancel each
# other: a merge commit whose run was cancelled is not one bisect can trust.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --all-targets is what reaches the test code, including the module that
      # exports the web client's types.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The wire-type check, the contract suite and the e2e suite each build and
      # run the Axum server, so this job needs the Rust toolchain too.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # e2e runs Playwright's default chromium project; --with-deps installs the
      # system libraries a bare runner is missing.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
