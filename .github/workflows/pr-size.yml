name: PR size

# Its own workflow rather than a job in ci.yml: the label events that clear the
# check would otherwise re-run the whole gate every time a label moves.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      # Always runs to a real pass or fail. A job skipped by an `if` reports
      # "skipped", which is a weaker thing for a required check to rest on.
      - name: Measure the diff
        # `-o pipefail`, which the default shell for a `run:` step lacks: without
        # it a failed `gh api` leaves the sum at 0 and the gate passes green.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: 500
          OVERRIDDEN: ${{ contains(github.event.pull_request.labels.*.name, 'oversize-ok') }}
        run: |
          # Per file rather than the PR's own totals, so the generated ones can
          # be left out: nobody reviews a lockfile bump or a wire.ts
          # regeneration, and counting them trains the override into a reflex.
          # `--jq` runs per page, so the sum is taken here rather than in jq.
          total=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.filename | test("^(Cargo\\.lock|web/(package-lock\\.json|src/api/wire\\.ts))$") | not) | .additions + .deletions' \
            | awk '{ sum += $1 } END { print sum + 0 }')
          echo "$total changed lines, generated files excluded (limit $LIMIT)"
          if [ "$total" -le "$LIMIT" ]; then exit 0; fi
          if [ "$OVERRIDDEN" = true ]; then
            echo "over the limit, and the oversize-ok label says that is deliberate"
            exit 0
          fi
          echo "::error::$total changed lines, over the $LIMIT-line limit. Split the PR, or label it oversize-ok to say the size is deliberate."
          exit 1
