[package]
name = "structure-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rusqlite = {version = "0.39.0", features = ["bundled"] }
thiserror = "2.0.18"
ts-rs = { version = "12", optional = true }

[features]
# Derives the TypeScript bindings on the wire types. Enabled by structure-server,
# which exports them; structure-ffi builds without ts-rs in its graph at all.
ts = ["dep:ts-rs"]
